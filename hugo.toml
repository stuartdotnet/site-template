baseURL = 'https://example.com/'
locale = 'en-us'
title = 'Site Template'

# robots.txt is generated from layouts/robots.txt so the sitemap line
# follows baseURL. Never ship a static one with a hardcoded URL.
enableRobotsTXT = true

# Photos are published only as the resized WebP versions the layouts ask for.
# Without this Hugo also copies each original (full size, EXIF and GPS data
# intact) into the public site. Scoped to the photography page, so article
# images are unaffected.
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade.target]
    path = '{/photography,/photography/**}'

[taxonomies]
  tag = 'tags'
  author = 'authors'

[params]
  description = 'A short, honest sentence about what this site is for.'
  tagline = 'A one-line pitch for the site goes here'
  author = 'Site Template'
  # Shown on the contact page. Leave blank to hide the "email us" line.
  contactEmail = 'hello@example.com'

  # The contact form posts to an endpoint you run (see README.md, "Contact
  # form"). All three must be set together or the form silently has no spam
  # protection.
  [params.contact]
    siteId = ''
    endpoint = ''
    turnstileSiteKey = ''

  [params.social]
    # Delete any line you don't need — social-icons.html only renders what's set.
    x = 'https://x.com/example'
    instagram = 'https://instagram.com/example'
    facebook = 'https://facebook.com/example'
    linkedin = 'https://linkedin.com/company/example'
    youtube = 'https://youtube.com/@example'

  # Generative engine optimisation. See "Show up in AI answers" in README.md.
  [params.geo]
    # "Organization" or "Person". Who the site is, for the structured data.
    entityType = 'Organization'
    # Overrides params.description in /llms.txt. One or two factual sentences.
    summary = ''
    # Profile URLs beyond [params.social], e.g. GitHub, Wikipedia, a Substack.
    sameAs = []
    # Topics the site is an authority on.
    knowsAbout = []
    # Set false to drop the named AI crawler groups from robots.txt.
    aiCrawlers = true
    # Optional <title> for the home page. Defaults to the site title.
    homeTitle = ''

[menu]
  [[menu.main]]
    name = 'Articles'
    url = '/articles/'
    weight = 1

  [[menu.main]]
    name = 'Authors'
    url = '/authors/'
    weight = 2

  [[menu.main]]
    name = 'Photography'
    url = '/photography/'
    weight = 3

  [[menu.main]]
    name = 'About'
    url = '/about/'
    weight = 4

  [[menu.main]]
    name = 'Contact'
    url = '/contact/'
    weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'monokai'
    lineNos = false
    lineNumbersInTable = false

# /llms.txt, generated from layouts/index.llms.txt so it follows baseURL.
[outputFormats]
  [outputFormats.LLMS]
    mediaType = 'text/plain'
    baseName = 'llms'
    isPlainText = true
    notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'LLMS']
  section = ['HTML', 'RSS']

[security]
  allowContent = ['text/html', 'text/markdown', 'text/plain']

[caches]
  [caches.getresource]
    dir = ':cacheDir/:project'
    maxAge = '1h'
